# =============================================================================
# Nginx configuration for RIAP frontend (SPA + API reverse proxy)
# =============================================================================

server {
    listen 80;
    server_name _;

    # Document root where the Vite build artifacts are served from
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------------------------------------------------------------------
    # API reverse proxy — forward /api/ requests to the FastAPI backend.
    # Trailing slash on proxy_pass strips the /api prefix so FastAPI
    # receives /api/v1/... → /v1/... 
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # WebSocket / SSE support (for agent status streaming)
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------------
    # Static assets — long cache headers for hashed filenames (Vite output)
    # ---------------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # SPA fallback — all other routes handled by index.html (React Router)
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Health-check endpoint (used by Docker / load balancers)
    # ---------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------------
    # Hide Nginx version
    # ---------------------------------------------------------------------------
    server_tokens off;
}
