# Alembic configuration for RIAP backend
# Full documentation: https://alembic.sqlalchemy.org/

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = migrations

# Prepend sys.path with this location so that app.* imports resolve
prepend_sys_path = .

# SQLAlchemy URL — overridden by env.py at runtime via DATABASE_URL env var.
# The %(VAR)s tokens are fallbacks read from [alembic:vars] below.
sqlalchemy.url = postgresql://%(DB_USER)s:%(DB_PASS)s@%(DB_HOST)s/%(DB_NAME)s

# Template used to generate new migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the generated timestamps
timezone = UTC

# Whether to truncate long migration messages in the output
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command.
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py source
sourceless = false

# Version path separator (os, : or ;)
version_path_separator = os

# Output encoding
output_encoding = utf-8

[alembic:vars]
DB_USER = riap_user
DB_PASS = change_me_in_production
DB_HOST = db
DB_NAME = riap_db

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
